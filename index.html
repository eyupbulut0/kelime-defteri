<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>İsim, Şehir, Hayvan, Bitki — Kelime Defteri</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>✏️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600;700&family=Libre+Franklin:ital,wght@0,400;0,500;0,600;0,700;1,500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<style>
  :root {
    --paper: #EEF2F6;
    --paper-raised: #FFFFFF;
    --rule: #B9CBDD;
    --rule-strong: #93AEC7;
    --margin: #C0505A;
    --ink: #223047;
    --ink-soft: #5B6B85;
    --accent-green: #2F6B4F;
    --accent-green-bg: #DFEEE5;
    --accent-mustard: #B8791E;
    --danger: #B23A3A;
    --focus: #3C6E9E;
    --shadow: rgba(34, 48, 71, 0.14);
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #171C26; --paper-raised: #1F2634; --rule: #34405A; --rule-strong: #445576;
      --margin: #D97783; --ink: #E7ECF4; --ink-soft: #A9B5CC; --accent-green: #6FCB9A;
      --accent-green-bg: #1E3A2E; --accent-mustard: #E0AC55; --danger: #E08080; --focus: #7BAEDD;
      --shadow: rgba(0,0,0,0.45); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #171C26; --paper-raised: #1F2634; --rule: #34405A; --rule-strong: #445576;
    --margin: #D97783; --ink: #E7ECF4; --ink-soft: #A9B5CC; --accent-green: #6FCB9A;
    --accent-green-bg: #1E3A2E; --accent-mustard: #E0AC55; --danger: #E08080; --focus: #7BAEDD;
    --shadow: rgba(0,0,0,0.45); color-scheme: dark;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    background: var(--paper); color: var(--ink);
    font-family: "Libre Franklin", system-ui, sans-serif;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    min-height: 100%;
    background-image: linear-gradient(var(--rule) 1px, transparent 1px);
    background-size: 100% 40px;
    background-position: 0 78px;
  }
  .margin-line { position: fixed; top: 0; bottom: 0; left: 48px; width: 2px; background: var(--margin); opacity: 0.55; z-index: 0; }
  @media (max-width: 640px) { .margin-line { left: 22px; } }
  .wrap { position: relative; z-index: 1; max-width: 720px; margin: 0 auto; padding: 28px 24px 56px 68px; }
  @media (max-width: 640px) { .wrap { padding: 22px 18px 48px 40px; } }
  header.top { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 6px; }
  .brand { font-family: "Caveat", cursive; font-weight: 700; font-size: 2.4rem; line-height: 1; color: var(--ink); }
  .theme-toggle { background: none; border: 1px solid var(--rule-strong); color: var(--ink-soft); border-radius: 20px; padding: 5px 12px; font-size: 0.78rem; font-family: "Libre Franklin", sans-serif; cursor: pointer; }
  .theme-toggle:hover { color: var(--ink); border-color: var(--ink-soft); }
  .subhead { color: var(--ink-soft); font-size: 0.95rem; margin: 0 0 24px; max-width: 48ch; }
  .status-pill { display: inline-flex; align-items: center; gap: 6px; font-size: 0.78rem; font-weight: 600; padding: 4px 12px; border-radius: 20px; margin-bottom: 20px; }
  .status-pill.ok { background: var(--accent-green-bg); color: var(--accent-green); }
  .status-pill.wait { background: color-mix(in srgb, var(--accent-mustard) 18%, transparent); color: var(--accent-mustard); }
  .status-pill.bad { background: color-mix(in srgb, var(--danger) 18%, transparent); color: var(--danger); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
  .status-pill.wait .dot { animation: pulse 1.1s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
  .card { background: var(--paper-raised); border: 1px solid var(--rule); border-radius: 10px; padding: 22px 22px 24px; margin-bottom: 18px; box-shadow: 0 1px 2px var(--shadow); }
  label.field-label { display: block; font-size: 0.82rem; color: var(--ink-soft); margin-bottom: 6px; font-weight: 600; }
  input[type="text"] { width: 100%; font-family: "Libre Franklin", sans-serif; font-size: 1rem; padding: 10px 12px; border: none; border-bottom: 2px solid var(--rule-strong); background: transparent; color: var(--ink); outline: none; border-radius: 2px; }
  input[type="text"]:focus { border-bottom-color: var(--focus); background: color-mix(in srgb, var(--focus) 6%, transparent); }
  input[type="text"]::placeholder { color: var(--ink-soft); opacity: 0.6; }
  .row-gap { margin-bottom: 16px; }
  button.btn { font-family: "Libre Franklin", sans-serif; font-weight: 600; font-size: 0.92rem; padding: 11px 20px; border-radius: 8px; border: 1px solid transparent; cursor: pointer; transition: transform 0.08s ease, filter 0.12s ease; }
  button.btn:active { transform: translateY(1px); }
  button.btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btn-primary { background: var(--ink); color: var(--paper); }
  .btn-primary:hover:not(:disabled) { filter: brightness(1.2); }
  .btn-secondary { background: transparent; border-color: var(--rule-strong); color: var(--ink); }
  .btn-secondary:hover:not(:disabled) { border-color: var(--ink-soft); }
  .btn-danger { background: var(--margin); color: #fff; }
  .btn-danger:hover:not(:disabled) { filter: brightness(1.08); }
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }
  .choice-row { display: flex; gap: 10px; margin-bottom: 20px; }
  .choice-row .btn { flex: 1; }
  .code-display { font-family: "IBM Plex Mono", monospace; font-size: 1.9rem; font-weight: 600; letter-spacing: 0.12em; color: var(--focus); background: color-mix(in srgb, var(--focus) 10%, transparent); border: 1px dashed var(--focus); border-radius: 8px; padding: 12px 18px; text-align: center; user-select: all; }
  .code-hint { font-size: 0.8rem; color: var(--ink-soft); margin-top: 8px; text-align: center; }
  .player-chip { display: inline-flex; align-items: center; gap: 6px; background: var(--accent-green-bg); color: var(--accent-green); font-size: 0.82rem; font-weight: 600; padding: 5px 12px; border-radius: 20px; margin: 0 8px 8px 0; }
  .player-chip.host::after { content: "· kurucu"; opacity: 0.7; font-weight: 500; }
  .letter-stage { text-align: center; padding: 8px 0 4px; }
  .letter-label { font-size: 0.85rem; color: var(--ink-soft); margin-bottom: 2px; }
  .letter-big { font-family: "Caveat", cursive; font-weight: 700; font-size: 6.5rem; line-height: 1; color: var(--margin); display: inline-block; transform: rotate(-2deg); }
  .timer { font-family: "IBM Plex Mono", monospace; font-size: 1.4rem; font-weight: 600; margin-top: 4px; color: var(--ink); min-height: 1.6em; }
  .timer.warn { color: var(--danger); }
  .answer-row { display: grid; grid-template-columns: 92px 1fr; align-items: center; gap: 14px; padding: 9px 0; border-bottom: 1px solid var(--rule); }
  .answer-row:last-child { border-bottom: none; }
  .answer-row .cat-name { font-size: 0.86rem; color: var(--ink-soft); font-weight: 600; }
  .finish-btn { width: 100%; margin-top: 18px; padding: 15px; font-family: "Caveat", cursive; font-size: 1.6rem; font-weight: 700; letter-spacing: 1px; }
  table.reveal { width: 100%; border-collapse: collapse; font-size: 0.9rem; }
  table.reveal th { text-align: left; font-size: 0.74rem; color: var(--ink-soft); font-weight: 700; padding: 6px 8px; border-bottom: 2px solid var(--rule-strong); }
  table.reveal td { padding: 8px 8px; border-bottom: 1px solid var(--rule); vertical-align: top; }
  .cell-word { display: inline-flex; align-items: center; gap: 6px; padding: 3px 7px; border-radius: 6px; }
  .cell-word.clickable { cursor: pointer; }
  .cell-word.clickable:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
  .cell-word.invalid { text-decoration: line-through; color: var(--danger); opacity: 0.75; }
  .cell-word.empty { color: var(--ink-soft); font-style: italic; opacity: 0.6; }
  .pts { font-family: "IBM Plex Mono", monospace; font-size: 0.72rem; color: var(--accent-green); font-weight: 600; }
  .pts.zero { color: var(--ink-soft); }
  .auto-flag { font-size: 0.68rem; color: var(--danger); font-weight: 600; }
  .scoreboard { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 18px; }
  .score-pill { flex: 1; min-width: 120px; background: var(--paper-raised); border: 1px solid var(--rule); border-radius: 10px; padding: 10px 14px; box-shadow: 0 1px 2px var(--shadow); }
  .score-pill .nm { font-size: 0.8rem; color: var(--ink-soft); font-weight: 600; }
  .score-pill .val { font-family: "IBM Plex Mono", monospace; font-size: 1.4rem; font-weight: 600; color: var(--ink); }
  .empty-state { text-align: center; color: var(--ink-soft); font-size: 0.9rem; padding: 10px 0 4px; }
  .toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%) translateY(12px); background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 8px; font-size: 0.86rem; opacity: 0; pointer-events: none; transition: opacity 0.2s ease, transform 0.2s ease; z-index: 20; max-width: 85vw; text-align: center; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
  .hidden { display: none !important; }
  .round-tag { font-size: 0.78rem; color: var(--ink-soft); font-weight: 600; margin-bottom: 10px; }
  .small-note { font-size: 0.78rem; color: var(--ink-soft); margin-top: 10px; }
</style>
</head>
<body>
<div class="margin-line"></div>
<div class="wrap">
  <header class="top">
    <div class="brand">Moon&amp;Cloud Artz</div>
    <button class="theme-toggle" id="themeToggle" type="button">koyu / açık</button>
  </header>
  <div id="statusPill" class="status-pill hidden"></div>

  <section id="screen-home">
    <div class="card">
      <div class="row-gap">
        <label class="field-label" for="nameInput">Adın</label>
        <input type="text" id="nameInput" maxlength="20" placeholder="ör. Eyüp">
      </div>
      <div class="choice-row">
        <button class="btn btn-primary" id="showCreate" type="button">Oda Kur</button>
        <button class="btn btn-secondary" id="showJoin" type="button">Odaya Katıl</button>
      </div>
      <div id="joinFields" class="hidden">
        <label class="field-label" for="codeInput">Oda kodu</label>
        <input type="text" id="codeInput" maxlength="6" placeholder="ör. K3P9LZ" style="text-transform:uppercase">
        <div class="btn-row" style="margin-top:14px;">
          <button class="btn btn-primary" id="doJoin" type="button">Katıl</button>
        </div>
      </div>
    </div>
    <p class="small-note" id="homeStatus"></p>
  </section>

  <section id="screen-lobby" class="hidden">
    <div class="card">
      <div class="round-tag" id="lobbyRoundTag">Lobide</div>
      <div class="code-display" id="lobbyCode">------</div>
      <div class="code-hint">Bu kodu arkadaşına gönder</div>
    </div>
    <div class="card">
      <label class="field-label">Oyuncular</label>
      <div id="lobbyPlayers"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="startRoundBtn" type="button">Turu Başlat</button>
      <button class="btn btn-secondary" id="leaveBtn" type="button">Odadan Ayrıl</button>
    </div>
    <p class="small-note" id="lobbyNote"></p>
  </section>

  <section id="screen-round" class="hidden">
    <div class="scoreboard" id="roundScoreboard"></div>
    <div class="card letter-stage">
      <div class="letter-label" id="roundTag">1. tur</div>
      <div class="letter-big" id="letterBig">A</div>
      <div class="timer" id="timerDisplay"></div>
    </div>
    <div class="card">
      <div id="answerRows"></div>
      <button class="btn btn-primary finish-btn" id="finishBtn" type="button">Bitirdim</button>
      <p class="small-note" id="roundNote">Cevapların rakibinden, tur bitene kadar gizli kalır.</p>
    </div>
  </section>

  <section id="screen-reveal" class="hidden">
    <div class="scoreboard" id="revealScoreboard"></div>
    <div class="card">
      <div class="round-tag" id="revealRoundTag">1. tur — sonuçlar</div>
      <div style="overflow-x:auto;"><table class="reveal" id="revealTable"></table></div>
      <p class="small-note">Kırmızı harf uyarısı olanlar otomatik geçersiz sayıldı. Diğer kelimelere tıklayarak geçerli/geçersiz işaretleyebilirsin.</p>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="nextRoundBtn" type="button">Sonraki Tur</button>
      <button class="btn btn-secondary" id="endGameBtn" type="button">Oyunu Sonuçlandır</button>
      <button class="btn btn-secondary" id="leaveBtnReveal" type="button">Odadan Ayrıl</button>
    </div>
  </section>

  <section id="screen-gameover" class="hidden">
    <div class="card" style="text-align:center;">
      <div class="round-tag">Oyun Bitti</div>
      <div id="winnerAnnounce" style="font-family:'Caveat',cursive;font-size:2.3rem;font-weight:700;margin:4px 0 16px;"></div>
      <div class="scoreboard" id="gameoverScoreboard"></div>
    </div>
    <div class="btn-row">
      <button class="btn btn-primary" id="playAgainBtn" type="button">Yeniden Oyna</button>
      <button class="btn btn-secondary" id="leaveBtnGameover" type="button">Odadan Ayrıl</button>
    </div>
  </section>
</div>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var CATEGORIES = ["İsim", "Şehir", "Hayvan", "Bitki", "Ünlü", "Eşya"];
  var LETTERS = ["A","B","C","Ç","D","E","F","G","H","I","İ","J","K","L","M","N","O","Ö","P","R","S","Ş","T","U","Ü","V","Y","Z"];
  var FINISH_WINDOW_MS = 30000;
  var CODE_CHARS = "ABCDEFGHJKLMNPRSTUVYZ23456789";
  var ROOM_PREFIX = "ihb1-";

  var peer = null, conn = null, role = null, myPid = null;
  var state = null;
  var myName = localStorage.getItem("ihb_name") || "";
  var localAnswers = {};
  var myFinished = false;
  var roundKey = null;
  var flushTimeout = null, finalizeTimeout = null, uiTimerInterval = null;
  var reconnectAttempts = 0;

  function $(id) { return document.getElementById(id); }
  function show(id) { $(id).classList.remove("hidden"); }
  function hide(id) { $(id).classList.add("hidden"); }
  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]; }); }
  function trLower(s) { return String(s || "").trim().toLocaleLowerCase("tr-TR"); }

  var toastTimer = null;
  function toast(msg) {
    var t = $("toast"); t.textContent = msg; t.classList.add("show");
    clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2600);
  }
  function setStatus(kind, text) {
    var p = $("statusPill");
    p.className = "status-pill " + kind;
    p.innerHTML = '<span class="dot"></span>' + esc(text);
    show("statusPill");
  }

  (function initTheme() {
    var saved = localStorage.getItem("ihb_theme");
    if (saved === "dark" || saved === "light") document.documentElement.setAttribute("data-theme", saved);
    $("themeToggle").addEventListener("click", function () {
      var next = document.documentElement.getAttribute("data-theme") === "dark" ? "light" : "dark";
      document.documentElement.setAttribute("data-theme", next);
      localStorage.setItem("ihb_theme", next);
    });
  })();

  function goScreen(name) {
    ["home", "lobby", "round", "reveal", "gameover"].forEach(function (s) { if (s === name) show("screen-" + s); else hide("screen-" + s); });
  }

  function genCode() { var c = ""; for (var i = 0; i < 6; i++) c += CODE_CHARS[Math.floor(Math.random() * CODE_CHARS.length)]; return c; }
  function pickLetter() { return LETTERS[Math.floor(Math.random() * LETTERS.length)]; }

  // ---------- home ----------
  $("nameInput").value = myName;
  $("nameInput").addEventListener("input", function () { myName = this.value; localStorage.setItem("ihb_name", myName); });
  $("nameInput").addEventListener("keydown", function (e) { if (e.key === "Enter") $("showCreate").click(); });
  $("showJoin").addEventListener("click", function () { $("joinFields").classList.toggle("hidden"); });
  $("codeInput").addEventListener("keydown", function (e) { if (e.key === "Enter") $("doJoin").click(); });

  function requireName() {
    myName = $("nameInput").value.trim();
    if (!myName) { toast("Önce adını yaz."); return false; }
    localStorage.setItem("ihb_name", myName);
    return true;
  }

  $("showCreate").addEventListener("click", function () {
    if (!requireName()) return;
    hide("joinFields");
    $("homeStatus").textContent = "Oda kuruluyor…";
    createRoom();
  });

  $("doJoin").addEventListener("click", function () {
    if (!requireName()) return;
    var code = $("codeInput").value.trim().toUpperCase();
    if (!code) { toast("Önce bir oda kodu gir."); return; }
    $("homeStatus").textContent = "Odaya bağlanılıyor…";
    joinRoom(code);
  });

  // ---------- peer setup ----------
  function createRoom(existingCode) {
    var code = existingCode || genCode();
    var p = new Peer(ROOM_PREFIX + code, { debug: 1 });
    p.on("open", function () {
      peer = p; role = "host"; myPid = "host";
      state = {
        round: 0, phase: "lobby", letter: null, categories: CATEGORIES,
        players: { host: { name: myName } },
        scores: { host: 0 },
        answers: {}, invalid: {}, finishedBy: {}, finishStartedAt: null, roundStartedAt: null
      };
      localStorage.setItem("ihb_room", code);
      localStorage.setItem("ihb_role", "host");
      renderLobby(code);
      setStatus("wait", "Oda kuruldu — arkadaşını bekliyoruz");
      $("homeStatus").textContent = "";
    });
    p.on("connection", function (c) {
      if (conn) { c.close(); return; } // only one guest supported
      conn = c;
      wireHostConnection(c);
    });
    p.on("error", function (err) {
      if (err && err.type === "unavailable-id") {
        createRoom(); // collision on the public broker, try a fresh code
      } else if (!state) {
        $("homeStatus").textContent = "Oda kurulamadı (" + (err && err.type || "bağlantı hatası") + "). Tekrar dener misin?";
      } else {
        setStatus("bad", "Bağlantı sorunu");
      }
    });
  }

  function joinRoom(code) {
    var p = new Peer(undefined, { debug: 1 });
    p.on("open", function () {
      peer = p; role = "guest"; myPid = "guest";
      var c = p.connect(ROOM_PREFIX + code, { reliable: true });
      conn = c;
      c.on("open", function () {
        localStorage.setItem("ihb_room", code);
        localStorage.setItem("ihb_role", "guest");
        conn.send({ type: "hello", name: myName });
        setStatus("ok", "Bağlandı");
      });
      wireGuestConnection(c, code);
    });
    p.on("error", function (err) {
      $("homeStatus").textContent = "Odaya bağlanılamadı — kodu kontrol et ya da arkadaşının odayı hâlâ açık tuttuğundan emin ol.";
    });
  }

  function wireHostConnection(c) {
    c.on("data", function (data) { handleHostMessage(data); });
    c.on("close", function () {
      conn = null;
      setStatus("wait", "Arkadaşının bağlantısı kesildi — bekleniyor");
      toast("Arkadaşının bağlantısı kesildi.");
    });
    c.on("open", function () {
      setStatus("ok", "Bağlandı");
    });
  }

  function wireGuestConnection(c, code) {
    c.on("data", function (data) {
      if (data.type === "state") { state = data.state; render(); }
      else if (data.type === "flush") { if (!myFinished) sendFinish(); }
    });
    c.on("close", function () {
      setStatus("bad", "Bağlantı kesildi");
      toast("Ev sahibiyle bağlantı koptu. Tekrar bağlanmayı deniyoruz…");
      attemptReconnect(code);
    });
    c.on("open", function () {
      setStatus("ok", "Bağlandı");
    });
  }

  function attemptReconnect(code) {
    if (reconnectAttempts >= 5) { setStatus("bad", "Bağlanamadı — odaya tekrar katılmayı dene"); return; }
    reconnectAttempts++;
    setTimeout(function () {
      var p = new Peer(undefined, { debug: 1 });
      p.on("open", function () {
        peer = p;
        var c = p.connect(ROOM_PREFIX + code, { reliable: true });
        conn = c;
        c.on("open", function () { reconnectAttempts = 0; conn.send({ type: "hello", name: myName }); setStatus("ok", "Yeniden bağlandı"); });
        wireGuestConnection(c, code);
      });
      p.on("error", function () { attemptReconnect(code); });
    }, 1200 * reconnectAttempts);
  }

  function broadcastState() {
    if (conn && conn.open) conn.send({ type: "state", state: state });
    render();
  }

  // ---------- host-side message + action handling ----------
  function handleHostMessage(data) {
    if (data.type === "hello") {
      state.players.guest = { name: data.name };
      if (!(state.scores && "guest" in state.scores)) state.scores.guest = 0;
      broadcastState();
      return;
    }
    applyAction(data.type, data, "guest");
  }

  function applyAction(type, payload, actorPid) {
    if (type === "startRound") {
      if (state.phase !== "lobby") return;
      state.phase = "round";
      state.round = (state.round || 0) + 1;
      state.letter = pickLetter();
      state.answers = {};
      state.invalid = {};
      state.finishedBy = {};
      state.finishStartedAt = null;
      state.roundStartedAt = Date.now();
      broadcastState();
    } else if (type === "finish") {
      if (state.phase !== "round") return;
      state.answers[actorPid] = payload.answers || {};
      state.finishedBy[actorPid] = true;
      var everyoneIn = Object.keys(state.players).every(function (pid) { return state.finishedBy[pid]; });
      if (!state.finishStartedAt) {
        state.finishStartedAt = Date.now();
        scheduleFinishWindow();
      }
      if (everyoneIn) {
        clearHostTimers();
        finalizeToReveal();
        return;
      }
      broadcastState();
    } else if (type === "toggleInvalid") {
      state.invalid[payload.pid] = state.invalid[payload.pid] || {};
      state.invalid[payload.pid][payload.cat] = !state.invalid[payload.pid][payload.cat];
      broadcastState();
    } else if (type === "nextRound") {
      finalizeScoresAndReset();
      broadcastState();
    } else if (type === "endGame") {
      state.phase = "gameover";
      broadcastState();
    } else if (type === "playAgain") {
      var ids2 = Object.keys(state.players || {});
      var resetScores = {};
      ids2.forEach(function (id) { resetScores[id] = 0; });
      state.scores = resetScores;
      state.phase = "lobby";
      state.round = 0;
      state.letter = null;
      state.answers = {};
      state.invalid = {};
      state.finishedBy = {};
      state.finishStartedAt = null;
      broadcastState();
    } else if (type === "requestFlush") {
      // handled locally on host below
    }
  }

  function scheduleFinishWindow() {
    clearHostTimers();
    flushTimeout = setTimeout(function () {
      if (conn && conn.open) conn.send({ type: "flush" });
      if (role === "host" && !myFinished) sendFinish();
    }, Math.max(0, FINISH_WINDOW_MS - 1000));
    finalizeTimeout = setTimeout(function () {
      finalizeToReveal();
    }, FINISH_WINDOW_MS + 400);
  }

  function clearHostTimers() {
    if (flushTimeout) { clearTimeout(flushTimeout); flushTimeout = null; }
    if (finalizeTimeout) { clearTimeout(finalizeTimeout); finalizeTimeout = null; }
  }

  function finalizeToReveal() {
    clearHostTimers();
    if (state.phase !== "round") return;
    state.phase = "reveal";
    state.roundEndedAt = Date.now();
    broadcastState();
  }

  function finalizeScoresAndReset() {
    var ids = Object.keys(state.players || {});
    var cats = state.categories || CATEGORIES;
    var answers = state.answers || {};
    var invalid = state.invalid || {};
    var letter = state.letter;
    var newScores = Object.assign({}, state.scores || {});
    ids.forEach(function (id) { if (!(id in newScores)) newScores[id] = 0; });

    cats.forEach(function (cat) {
      var counts = {};
      ids.forEach(function (id) {
        var raw = (answers[id] || {})[cat] || "";
        var w = trLower(raw);
        var letterOk = raw && letter && trLower(raw)[0] === trLower(letter)[0];
        var manualInvalid = !!((invalid[id] || {})[cat]);
        if (raw && letterOk && !manualInvalid) counts[w] = (counts[w] || 0) + 1;
      });
      ids.forEach(function (id) {
        var raw = (answers[id] || {})[cat] || "";
        var w = trLower(raw);
        var letterOk = raw && letter && trLower(raw)[0] === trLower(letter)[0];
        var manualInvalid = !!((invalid[id] || {})[cat]);
        if (raw && letterOk && !manualInvalid) newScores[id] += counts[w] > 1 ? 5 : 10;
      });
    });

    state.scores = newScores;
    state.phase = "lobby";
    state.letter = null;
    state.answers = {};
    state.invalid = {};
    state.finishedBy = {};
    state.finishStartedAt = null;
  }

  // ---------- action sending (works for both host and guest) ----------
  function sendAction(type, payload) {
    var msg = Object.assign({ type: type }, payload || {});
    if (role === "host") {
      applyAction(type, msg, "host");
    } else if (conn && conn.open) {
      conn.send(msg);
    } else {
      toast("Bağlantı yok, gönderilemedi.");
    }
  }

  function sendFinish() {
    if (myFinished) return;
    myFinished = true;
    sendAction("finish", { answers: Object.assign({}, localAnswers) });
  }

  // ---------- leaving ----------
  function leaveRoom() {
    clearHostTimers();
    if (uiTimerInterval) { clearInterval(uiTimerInterval); uiTimerInterval = null; }
    if (conn) { try { conn.close(); } catch (e) {} conn = null; }
    if (peer) { try { peer.destroy(); } catch (e) {} peer = null; }
    state = null; role = null; myPid = null; myFinished = false; localAnswers = {};
    localStorage.removeItem("ihb_room"); localStorage.removeItem("ihb_role");
    hide("statusPill");
    goScreen("home");
  }
  $("leaveBtn").addEventListener("click", leaveRoom);
  $("leaveBtnReveal").addEventListener("click", leaveRoom);

  // ---------- lobby ----------
  function renderLobby(code) {
    goScreen("lobby");
    $("lobbyCode").textContent = code || (localStorage.getItem("ihb_room") || "");
    $("lobbyRoundTag").textContent = state.round > 0 ? ("Tur " + state.round + " bitti — yeni tura hazır") : "Lobide";
    var pl = state.players || {};
    var ids = Object.keys(pl);
    $("lobbyPlayers").innerHTML = ids.map(function (id) {
      return '<span class="player-chip' + (id === "host" ? " host" : "") + '">' + esc(pl[id].name || "Oyuncu") + "</span>";
    }).join("") || '<span class="empty-state">Henüz kimse yok.</span>';
    var ready = ids.length >= 2;
    $("startRoundBtn").disabled = !ready;
    $("lobbyNote").textContent = ready ? "Herhangi biriniz turu başlatabilir." : "Arkadaşının koda katılmasını bekliyoruz.";
  }

  $("startRoundBtn").addEventListener("click", function () { sendAction("startRound", {}); });

  // ---------- round ----------
  function renderRound() {
    goScreen("round");
    var key = state.round + ":" + state.roundStartedAt;
    if (key !== roundKey) {
      roundKey = key; localAnswers = {}; myFinished = false;
      buildAnswerRows();
    }
    $("roundTag").textContent = (state.round || 1) + ". tur — harf:";
    $("letterBig").textContent = state.letter || "?";
    renderScoreboard("roundScoreboard");

    var finishedIds = Object.keys(state.finishedBy || {});
    var pl = state.players || {};
    if (finishedIds.length) {
      var names = finishedIds.map(function (id) { return (pl[id] && pl[id].name) || "Oyuncu"; });
      $("roundNote").textContent = names.join(", ") + " bitirdi — 30 saniye içinde tur kapanıyor.";
    } else {
      $("roundNote").textContent = "Cevapların rakibinden, tur bitene kadar gizli kalır.";
    }
    $("finishBtn").disabled = myFinished;
    $("finishBtn").textContent = myFinished ? "Gönderildi ✓" : "Bitirdim";

    if (!uiTimerInterval) uiTimerInterval = setInterval(tickTimer, 250);
    tickTimer();
  }

  function buildAnswerRows() {
    var cats = state.categories || CATEGORIES;
    $("answerRows").innerHTML = cats.map(function (c, i) {
      return '<div class="answer-row"><div class="cat-name">' + esc(c) + '</div>' +
        '<input type="text" class="ans-input" data-cat="' + esc(c) + '" autocomplete="off" placeholder="' + esc(state.letter || "") + '… ile başlayan ' + esc(c.toLocaleLowerCase("tr-TR")) + '"' + (i === 0 ? " autofocus" : "") + "></div>";
    }).join("");
    Array.prototype.forEach.call($("answerRows").querySelectorAll(".ans-input"), function (inp) {
      inp.addEventListener("input", function () { localAnswers[this.getAttribute("data-cat")] = this.value; });
    });
  }

  function tickTimer() {
    if (!state || state.phase !== "round") return;
    var td = $("timerDisplay");
    if (!state.finishStartedAt) { td.textContent = ""; td.classList.remove("warn"); return; }
    var left = Math.max(0, Math.ceil((state.finishStartedAt + FINISH_WINDOW_MS - Date.now()) / 1000));
    td.textContent = left + " sn kaldı";
    td.classList.toggle("warn", left <= 10);
  }

  $("finishBtn").addEventListener("click", function () { sendFinish(); });

  // ---------- reveal ----------
  function renderReveal() {
    goScreen("reveal");
    if (uiTimerInterval) { clearInterval(uiTimerInterval); uiTimerInterval = null; }
    renderScoreboard("revealScoreboard");
    $("revealRoundTag").textContent = (state.round || 1) + ". tur sonuçları — harf " + (state.letter || "?");

    var cats = state.categories || CATEGORIES;
    var pl = state.players || {};
    var ids = Object.keys(pl);
    var answers = state.answers || {};
    var invalid = state.invalid || {};
    var letter = state.letter;

    var thead = "<tr><th>Kategori</th>" + ids.map(function (id) { return "<th>" + esc(pl[id].name || "Oyuncu") + "</th>"; }).join("") + "</tr>";

    var rowsHtml = cats.map(function (cat) {
      var counts = {};
      ids.forEach(function (id) {
        var raw = (answers[id] || {})[cat] || "";
        var letterOk = raw && letter && trLower(raw)[0] === trLower(letter)[0];
        var manualInvalid = !!((invalid[id] || {})[cat]);
        var w = trLower(raw);
        if (raw && letterOk && !manualInvalid) counts[w] = (counts[w] || 0) + 1;
      });
      var tds = ids.map(function (id) {
        var raw = (answers[id] || {})[cat] || "";
        var letterOk = raw && letter && trLower(raw)[0] === trLower(letter)[0];
        var manualInvalid = !!((invalid[id] || {})[cat]);
        var autoInvalid = raw && !letterOk;
        var isInvalid = autoInvalid || manualInvalid;
        var w = trLower(raw);
        var pts = (raw && !isInvalid) ? (counts[w] > 1 ? 5 : 10) : 0;
        var cls = "cell-word" + (isInvalid ? " invalid" : "") + (!raw ? " empty" : "") + (raw && !autoInvalid ? " clickable" : "");
        var label = raw ? esc(raw) : "(boş)";
        var flag = autoInvalid ? '<span class="auto-flag" title="Bu harfle başlamıyor">⚑ harf</span>' : "";
        var ptsHtml = raw ? '<span class="pts' + (pts === 0 ? " zero" : "") + '">' + (pts === 0 ? "0" : "+" + pts) + "</span>" : "";
        var attrs = raw && !autoInvalid ? (' data-pid="' + id + '" data-cat="' + esc(cat) + '"') : "";
        return "<td><span class=\"" + cls + "\"" + attrs + ">" + label + flag + "</span> " + ptsHtml + "</td>";
      }).join("");
      return "<tr><td class=\"cat-name\">" + esc(cat) + "</td>" + tds + "</tr>";
    }).join("");

    $("revealTable").innerHTML = "<thead>" + thead + "</thead><tbody>" + rowsHtml + "</tbody>";
    Array.prototype.forEach.call($("revealTable").querySelectorAll(".cell-word.clickable"), function (el) {
      el.addEventListener("click", function () {
        sendAction("toggleInvalid", { pid: this.getAttribute("data-pid"), cat: this.getAttribute("data-cat") });
      });
    });
  }

  $("nextRoundBtn").addEventListener("click", function () { sendAction("nextRound", {}); });
  $("endGameBtn").addEventListener("click", function () { sendAction("endGame", {}); });
  $("playAgainBtn").addEventListener("click", function () { sendAction("playAgain", {}); });
  $("leaveBtnGameover").addEventListener("click", leaveRoom);

  // ---------- game over ----------
  function renderGameOver() {
    goScreen("gameover");
    if (uiTimerInterval) { clearInterval(uiTimerInterval); uiTimerInterval = null; }
    renderScoreboard("gameoverScoreboard");
    var pl = state.players || {}, sc = state.scores || {};
    var ids = Object.keys(pl);
    var best = -Infinity;
    ids.forEach(function (id) { if ((sc[id] || 0) > best) best = sc[id] || 0; });
    var winners = ids.filter(function (id) { return (sc[id] || 0) === best; });
    var announce;
    if (winners.length > 1) {
      announce = "🤝 Berabere! (" + best + " puan)";
    } else {
      var wid = winners[0];
      announce = "🏆 " + esc((pl[wid] && pl[wid].name) || "Oyuncu") + " kazandı!";
    }
    $("winnerAnnounce").textContent = announce;
  }

  // ---------- scoreboard + master render ----------
  function renderScoreboard(targetId) {
    var pl = state.players || {}, sc = state.scores || {};
    $(targetId).innerHTML = Object.keys(pl).map(function (id) {
      return '<div class="score-pill"><div class="nm">' + esc((pl[id] && pl[id].name) || "Oyuncu") + '</div><div class="val">' + (sc[id] || 0) + "</div></div>";
    }).join("");
  }

  function render() {
    if (!state) return;
    if (state.phase === "round") renderRound();
    else if (state.phase === "reveal") renderReveal();
    else if (state.phase === "gameover") renderGameOver();
    else renderLobby();
  }

  // ---------- deep link prefill ----------
  (function prefillFromHash() {
    var h = (window.location.hash || "").replace("#", "").trim().toUpperCase();
    if (h) { $("codeInput").value = h; show("joinFields"); }
  })();
})();
</script>
</body>
</html>
